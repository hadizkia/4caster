name: 4caster bot

# Every 5 minutes: a quick check for new Telegram messages. Only when there are some does the job set up Python
# and answer them, staying awake 10 minutes after the last message so follow-ups are answered at once.
# Daily at 02:15 UTC: download the newest model run and draw the standard products.
# Watchdog: GitHub's scheduler can go quiet for a while. If no scheduled run has happened for 30 minutes, each run
# starts the next check itself ("chain" mode: listen to Telegram for ~4 minutes, then hand over), until it returns.
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "poll = answer messages, refresh = download the newest model run"
        type: choice
        options: [poll, refresh]
        default: poll
      chain:
        description: "internal: started by the watchdog"
        type: string
        default: "0"

concurrency:
  group: wxbot            # one bot at a time (Telegram allows a single getUpdates reader)
  cancel-in-progress: false

permissions:
  contents: write         # keep-alive commit: GitHub pauses schedules after 60 days without repository activity
  actions: write          # delete old caches

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ADMIN_ID: ${{ secrets.ADMIN_ID }}
      ALLOWED_IDS: ${{ secrets.ALLOWED_IDS }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      BUNDLE_KEY: ${{ secrets.BUNDLE_KEY }}
      LLM_MODELS: ${{ vars.LLM_MODELS }}
      WX_WORK: ${{ github.workspace }}/cache
      CARTOPY_DATA_DIR: /tmp/cartopy
      SANDBOX_USER: sbx
      PYTHONWARNINGS: ignore
      TASK: ${{ github.event.schedule == '15 2 * * *' && 'refresh' || inputs.task || 'poll' }}
    steps:
      - name: Check for new Telegram messages
        id: peek
        env:
          LISTEN: ${{ inputs.chain == '1' && '240' || '0' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          day=$(date -u +%F); echo "day=$day" >> "$GITHUB_OUTPUT"
          # the daily refresh + farm alerts are due after 02:15 UTC until a run has done them today
          if [ "$TASK" = "poll" ] && [ "$(date -u +%H%M)" -ge 215 ] \
             && [ -z "$(gh cache list --key "daily-$day" --json key -q '.[].key' 2>/dev/null)" ]; then
            TASK=refresh
          fi
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          if [ "$TASK" = "refresh" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          peek() {  # number of waiting updates; long-polls up to $1 seconds and confirms nothing
            curl -s --max-time $(( $1 + 20 )) \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?timeout=$1&limit=1" \
              | python3 -c 'import sys, json; print(len(json.load(sys.stdin).get("result", [])))' || echo 1
          }
          end=$(( $(date +%s) + LISTEN )); n=$(peek 0)
          while [ "$n" = "0" ] && [ "$(date +%s)" -lt "$end" ]; do n=$(peek 50); done
          echo "pending updates: $n"
          if [ "$n" != "0" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.peek.outputs.go == 'true'
        with:
          persist-credentials: false   # nothing on disk that a generated script could use

      - uses: actions/setup-python@v5
        if: steps.peek.outputs.go == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install packages
        if: steps.peek.outputs.go == 'true'
        run: pip install -q -r requirements.txt

      - name: Sandbox user for generated plotting scripts
        if: steps.peek.outputs.go == 'true'
        run: |
          sudo useradd --create-home --shell /bin/bash sbx
          chmod 700 "$HOME"
          mkdir -p "$CARTOPY_DATA_DIR"

      - name: Restore bot state
        if: steps.peek.outputs.go == 'true'
        uses: actions/cache/restore@v4
        with:
          path: cache/state.bin
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Restore forecast data
        if: steps.peek.outputs.go == 'true'
        uses: actions/cache/restore@v4
        with:
          path: cache/runs
          key: wxdata-${{ github.run_id }}
          restore-keys: wxdata-

      - name: Map shapes
        if: steps.peek.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: /tmp/cartopy
          key: cartopy-naturalearth-v2

      - name: Run bot
        if: steps.peek.outputs.go == 'true'
        run: |
          if [ "${{ steps.peek.outputs.task }}" = "refresh" ]; then python run.py refresh
          else python run.py poll --idle 600 --max-runtime 3600; fi

      - name: Mark the daily job as done
        if: always() && steps.peek.outputs.task == 'refresh'
        run: mkdir -p cache && date -u > cache/.daily

      - name: Save daily marker
        if: always() && steps.peek.outputs.task == 'refresh'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: cache/.daily
          key: daily-${{ steps.peek.outputs.day }}

      - name: Save bot state
        if: always() && steps.peek.outputs.go == 'true' && hashFiles('cache/state.bin') != ''
        uses: actions/cache/save@v4
        with:
          path: cache/state.bin
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save forecast data
        if: always() && steps.peek.outputs.go == 'true' && hashFiles('cache/.wxdata_changed') != ''
        uses: actions/cache/save@v4
        with:
          path: cache/runs
          key: wxdata-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Tidy caches, keep the schedule alive
        if: always() && steps.peek.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for spec in state-:3 wxdata-:2 daily-:3; do
            prefix=${spec%%:*}; keep=${spec##*:}
            gh cache list --key "$prefix" --sort created_at --order desc --limit 100 --json id -q '.[].id' \
              | tail -n +$((keep + 1)) | xargs -r -n1 gh cache delete || true
          done
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +%F > .github/keepalive && git add .github/keepalive
            git commit -m "keep-alive: scheduled workflow" \
              && git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" HEAD:main || true
          fi

      - name: Watchdog (start the next check if the schedule is quiet)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          last=$(gh run list --workflow bot.yml --event schedule --limit 1 --json createdAt -q '.[0].createdAt // ""')
          age=999999; [ -n "$last" ] && age=$(( $(date +%s) - $(date -d "$last" +%s) ))
          if [ "$age" -gt 1800 ]; then
            echo "schedule quiet for ${age}s: starting the next check"
            gh workflow run bot.yml -f task=poll -f chain=1
          else
            echo "schedule active (last run ${age}s ago)"
          fi
